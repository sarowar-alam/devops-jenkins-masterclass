# ============================================================
# BMI Health Tracker — Nginx Frontend Configuration
# Used INSIDE the frontend Docker container (nginx:alpine)
#
# This config handles two responsibilities:
#   1. Serve the React SPA — all routes fall back to index.html
#      (required for React Router client-side routing)
#
#   2. Proxy /api requests to the backend service
#      In Docker Compose, the backend is reachable by its
#      service name 'backend' on port 3000 — NOT localhost:3000
# ============================================================

server {
    listen 80;
    server_name _;

    # Root directory where the React build (dist/) was copied
    root /usr/share/nginx/html;
    index index.html;

    # Compression — reduces transfer size for JS/CSS/HTML
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── React SPA Routing ─────────────────────────────────────
    # For any path that doesn't match a real file, serve index.html
    # This allows React Router to handle the URL on the client side
    # Example: /measurements → served as index.html → React renders the route
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets (JS/CSS chunks from Vite build)
        location ~* \.(js|css|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # ── API Proxy ─────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend service.
    # 'backend' is the Docker Compose service name — Docker's
    # internal DNS resolves it to the backend container's IP.
    location /api {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        # Pass original headers so backend knows the real client IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for HTTP/1.1 keep-alive (disables proxy buffering artifacts)
        proxy_set_header   Connection        "";

        # Timeouts — adjust if your backend takes longer to respond
        proxy_connect_timeout  30s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer settings for API responses
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Health Check Endpoint ─────────────────────────────────
    # Used by Docker health checks and load balancers
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Security Headers ─────────────────────────────────────
    # Basic security hardening
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Hide Nginx version ────────────────────────────────────
    server_tokens off;

    # ── Error pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
